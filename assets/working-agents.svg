<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Working Agents: from tasks to accepted work</title>
  <desc id="desc">A map of digital work, reliable agent capabilities, and model-harness optimization. Persistence and openness are independent work conditions.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10293f"/><stop offset="1" stop-color="#1d4160"/></linearGradient></defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="40" y="54" fill="#ffffff" font-size="34" font-weight="700">Working Agents</text>
    <text x="41" y="83" fill="#b9cfdf" font-size="17">From tasks to accepted digital work</text>
    <rect x="814" y="30" width="344" height="60" rx="10" fill="#2a4e69"/>
    <text x="834" y="54" fill="#c8dbe8" font-size="13">INDEPENDENT WORK CONDITIONS</text>
    <text x="834" y="77" fill="#ffffff" font-size="18">Persistence  ×  Openness</text>
    <text x="41" y="123" fill="#8cd9d2" font-size="12" letter-spacing="2">DIGITAL WORK</text>
    <g fill="#ffffff">
      <rect x="40" y="137" width="264" height="66" rx="10" fill="#eaf2f7"/>
      <rect x="325" y="137" width="264" height="66" rx="10" fill="#eaf2f7"/>
      <rect x="610" y="137" width="264" height="66" rx="10" fill="#eaf2f7"/>
      <rect x="895" y="137" width="264" height="66" rx="10" fill="#eaf2f7"/>
    </g>
    <g fill="#17364e" font-size="19" font-weight="700">
      <text x="58" y="165">Artifacts</text><text x="343" y="165">Workspaces</text>
      <text x="628" y="165">Apps &amp; tools</text><text x="913" y="165">Persistent work</text>
    </g>
    <g fill="#476379" font-size="13">
      <text x="58" y="187">Spreadsheets · slides · documents</text><text x="343" y="187">Files · dependencies · deliverables</text>
      <text x="628" y="187">GUI · browser · API · business state</text><text x="913" y="187">Memory · events · responsibilities</text>
    </g>
    <text x="41" y="237" fill="#8cd9d2" font-size="12" letter-spacing="2">RELIABLE EXECUTION</text>
    <rect x="40" y="251" width="1119" height="47" rx="10" fill="#2a4e69"/>
    <text x="60" y="281" fill="#ffffff" font-size="17">Understand</text>
    <text x="260" y="281" fill="#ffffff" font-size="17">Reason</text>
    <text x="440" y="281" fill="#ffffff" font-size="17">Plan &amp; coordinate</text>
    <text x="689" y="281" fill="#ffffff" font-size="17">Execute &amp; track state</text>
    <text x="977" y="281" fill="#ffffff" font-size="17">Verify &amp; recover</text>
    <text x="41" y="344" fill="#b9cfdf" font-size="15">IMPROVEMENT</text>
    <text x="207" y="344" fill="#ffffff" font-size="16">Environments, data &amp; rewards</text>
    <text x="553" y="344" fill="#ffffff" font-size="16">Model learning</text>
    <text x="775" y="344" fill="#ffffff" font-size="16">Harness design &amp; joint optimization</text>
  </g>
</svg>
